name = "gas-cut-revision-late"
artifacts = ["/app/answer.json"]

[metadata]
author_name = "Shailendrasinh Zala"
category = "Enterprise data"
subcategory = "Email archive reasoning"
tags = ["email-archive", "time-split", "superseded-information", "deal"]
difficulty = "hard"
difficulty_explanation = "The first report (6,599 cut, SIQ 118,401) was revised the same afternoon after the pipeline changed its allocation (4,856 cut, SIQ 120,144). Around it sit look-alike numbers: Enron's own per-contract cuts that add up to 4,856, delivered amounts of 33,401 and 35,144, and later emails in the same style for June 3 and June 5 with their own cuts and SIQ figures. Taking the first, the latest or the most frequent number in the thread gives a wrong answer."
solution_explanation = "Collect every email about gas day May 30 on contract 104684, order them by Date header, and take the last statement before the cut: the 19:50 UTC revision from Peoples Gas 'The May 30th cut ... is now 4,856 MMBtu' and 'Therefore, 125,000 of SIQ becomes 120,144 for May 30th.' Ignore the June 3 and June 5 emails, which are other gas days. solve.sh checks that email is in the mailbox and writes 4,856 and 120,144 citing it."
verification_explanation = "A separate container with no network reads /app/answer.json and checks both integers exactly, the JSON shape, and the citations: 1 to 5 Message-IDs that all exist in the snapshot, at least one of which is the revision email or a duplicate copy. Missing, symlinked, malformed or oversized answers score 0."

[verifier]
timeout_sec = 300
environment_mode = "separate"

[verifier.environment]
allow_internet = false
build_timeout_sec = 600
cpus = 1
memory_mb = 2048

[agent]
timeout_sec = 1800

[environment]
allow_internet = true
build_timeout_sec = 900
cpus = 2
memory_mb = 4096
storage_mb = 10240

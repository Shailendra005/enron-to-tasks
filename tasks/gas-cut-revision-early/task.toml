name = "gas-cut-revision-early"
artifacts = ["/app/answer.json"]

[metadata]
author_name = "Shailendrasinh Zala"
category = "Enterprise data"
subcategory = "Email archive reasoning"
tags = ["email-archive", "time-split", "superseded-information", "deal"]
difficulty = "easy"
difficulty_explanation = "Control task. The snapshot is about 500 emails from 90 days of a gas trader's mailbox, and at this moment exactly one email describes the May 30 cut on contract 104684. The agent still has to find it among routine nominations and report both numbers as integers with a valid citation."
solution_explanation = "Search the mailbox for contract 104684, read the 31 May email from Peoples Gas: the contract was cut by 6,599 MMBtu and Peoples reduced its SIQ purchase from 125,000 to 118,401. solve.sh checks that email is in the mailbox and writes those numbers citing it."
verification_explanation = "A separate container with no network reads /app/answer.json and checks both integers exactly, the JSON shape, and the citations: 1 to 5 Message-IDs that all exist in the snapshot, at least one of which is the email that states the numbers or a duplicate copy. Missing, symlinked, malformed or oversized answers score 0."

[verifier]
timeout_sec = 300
environment_mode = "separate"

[verifier.environment]
allow_internet = false
build_timeout_sec = 600
cpus = 1
memory_mb = 2048

[agent]
timeout_sec = 1800

[environment]
allow_internet = true
build_timeout_sec = 900
cpus = 2
memory_mb = 4096
storage_mb = 10240
